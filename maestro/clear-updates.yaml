# `clearUpdates` drops every downloaded update and the failed list.
# It then reloads the embedded bundle.
# The next sync downloads the release again. Continues from set-channel.yaml.
# By hand, on an app that runs the newest release, run
# `maestro test -e EXPECTED_RELEASE_NUMBER=7 -e EXPECTED_VERSION=v8 -e EMBEDDED_VERSION=v1 maestro/clear-updates.yaml`.
appId: com.hotcodepush.demo.cordova
---
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
    timeout: 30000
# The method buttons sit below the fold on a phone screen.
- scrollUntilVisible:
    element: 'Clear updates'
- tapOn: 'Clear updates'
# A page reload during a Maestro read can leave the Android view hierarchy empty for good.
# The flow therefore relaunches the app before it reads the screen.
- extendedWaitUntil:
    visible: 'embedded'
    timeout: 30000
    optional: true
- stopApp
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: ${EMBEDDED_VERSION}
    timeout: 30000
- assertVisible: 'embedded'
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
# A device that was offline retries on its next sync.
- repeat:
    times: 3
    while:
      visible: 'failed · device_offline.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
# The sync at start may have downloaded the release already.
# Either way it applies on the next start.
- assertVisible: '(downloaded|up_to_date).*'
- stopApp
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: ${EXPECTED_VERSION}
    timeout: 30000
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
