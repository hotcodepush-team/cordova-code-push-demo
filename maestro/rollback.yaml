# The next release never signals readiness.
# The SDK rolls back to the release before and blocklists it.
# Continues from golden-path.yaml. By hand, release a build whose page loads no script, then run
# `maestro test -e BROKEN_RELEASE_NUMBER=2 -e BROKEN_VERSION=v3 -e EXPECTED_RELEASE_NUMBER=1 -e EXPECTED_VERSION=v2 maestro/rollback.yaml`.
appId: com.hotcodepush.demo.cordova
---
- launchApp:
    permissions:
      notifications: allow
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- repeat:
    times: 3
    while:
      visible: 'failed · device_offline.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
# The check at start may have downloaded the broken release already.
# Either way it applies on the next start.
- assertVisible: '(downloaded|up_to_date).*'
- stopApp
- launchApp:
    permissions:
      notifications: allow
# The broken page shows only its label until the readiness gate times out and rolls back.
- extendedWaitUntil:
    visible: ${BROKEN_VERSION}
    timeout: 30000
- extendedWaitUntil:
    visible: 'from #${BROKEN_RELEASE_NUMBER} · ${BROKEN_VERSION} · readiness_timed_out'
    timeout: 60000
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
# The failed bundle is blocklisted on this device: the next check skips it.
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- assertVisible: 'skipped · bundle_failed_before'
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
