# The refused release: the build carries a public key, and the newest release
# is unsigned, or signed with a key the build does not trust, so the SDK
# refuses it with INVALID_SIGNATURE and the app stays on its embedded bundle.
# Runs on the fresh build the runner installs with a key in its
# configuration, once before the app has a signing key and once after. By
# hand, add a key to `publicKeys` in `hotcodepush.json`, rebuild, release
# unsigned and run `maestro test maestro/invalid-signature.yaml`.
appId: com.hotcodepush.demo.cordova
---
- launchApp
# A web view that just loaded is empty in the view hierarchy for a moment, so
# the tap waits for the button first.
- extendedWaitUntil:
    visible: 'Sync now'
    timeout: 30000
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- repeat:
    times: 3
    while:
      visible: 'FAILED · OFFLINE.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
- assertVisible: 'FAILED · INVALID_SIGNATURE.*'
- assertVisible: 'embedded'
