# The report the debug screen shares explains why the device did not update.
# After incompatible.yaml, its result line names the skipped check.
# By hand:
# `maestro test -e EXPECTED_LINE='Result: skipped device_incompatible binary' maestro/debug-screen.yaml`.
appId: com.hotcodepush.demo.cordova
---
- launchApp:
    permissions:
      notifications: allow
# A web view that just loaded shows an empty view hierarchy for a moment.
- extendedWaitUntil:
    visible: 'Debug screen'
    timeout: 30000
- tapOn: 'Debug screen'
- assertVisible: 'Check now'
- tapOn: 'Share'
# On iOS the runner reads the report from the pasteboard.
# On Android the share sheet previews the text.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Copy'
      - tapOn: 'Done'
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: '.*content_preview_text'
          text: '.*${EXPECTED_LINE}.*'
      - back
      - back
- assertVisible: 'Sync now'
