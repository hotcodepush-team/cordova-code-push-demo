# `rollbackUpdate` marks the running release failed and reloads the embedded bundle.
# The updateRolledBack listener reports app_requested, and the next check skips the release.
# Continues from clear-updates.yaml. By hand, on an app that runs the newest release, run
# `maestro test -e ROLLED_BACK_RELEASE_NUMBER=7 -e ROLLED_BACK_VERSION=v8 -e EXPECTED_VERSION=v1 maestro/rollback-update.yaml`.
appId: com.hotcodepush.demo.cordova
---
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: '#${ROLLED_BACK_RELEASE_NUMBER} · ${ROLLED_BACK_VERSION}'
    timeout: 30000
# The method buttons sit below the fold on a phone screen.
- scrollUntilVisible:
    element: 'Roll back'
- tapOn: 'Roll back'
# A page reload during a Maestro read can leave the Android view hierarchy empty for good.
# The flow therefore relaunches the app before it reads the screen.
# Only the page that the SDK reload starts receives the event, so it is read here.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'from #${ROLLED_BACK_RELEASE_NUMBER} · ${ROLLED_BACK_VERSION} · app_requested'
          timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: 'from #${ROLLED_BACK_RELEASE_NUMBER} · ${ROLLED_BACK_VERSION} · app_requested'
          timeout: 30000
          optional: true
# Every later read sees a process that started on the embedded bundle.
- stopApp
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: ${EXPECTED_VERSION}
    timeout: 30000
- assertVisible: 'embedded'
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
# A device that was offline retries on its next sync.
- repeat:
    times: 3
    while:
      visible: 'failed · device_offline.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
# The rolled-back bundle is on the failed list of this device, so the check skips it.
- assertVisible: 'skipped · bundle_failed_before'
- assertVisible: 'embedded'
