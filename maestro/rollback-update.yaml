# The app's own rollback: the button calls `rollbackUpdate` with a reason on
# the release the device runs, which the SDK marks failed on this device and
# leaves at once, reloading the page onto the embedded bundle, since the
# release it leaves is the confirmed one; the reloaded page's
# updateRolledBack listener names the release with app_requested, and the
# next check skips it bundle_failed_before. Continues from clear-updates.yaml,
# which left the app on the newest release; by hand, on an app that runs it,
# run
# `maestro test -e ROLLED_BACK_RELEASE_NUMBER=7 -e ROLLED_BACK_VERSION=v8 -e EXPECTED_VERSION=v1 maestro/rollback-update.yaml`.
# The SDK's reload in place can leave Android's view hierarchy empty for the
# rest of the process, so on Android the flow waits a bounded time for the
# rollback line and relaunches the app before it reads the screen.
# No `env:` header: Maestro defines it after the `-e` parameters, so its
# values would override them.
appId: com.hotcodepush.demo.cordova
---
# Every launch names its permissions: Maestro's default allows all, and its
# location grant can hang the iOS simulator on Xcode 27 for minutes.
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: '#${ROLLED_BACK_RELEASE_NUMBER} · ${ROLLED_BACK_VERSION}'
    timeout: 30000
# The method buttons sit below the fold on a phone's screen.
- scrollUntilVisible:
    element: 'Roll back'
- tapOn: 'Roll back'
# The event belongs to the page the SDK's own reload starts, the one place it
# is read.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'from #${ROLLED_BACK_RELEASE_NUMBER} · ${ROLLED_BACK_VERSION} · app_requested'
          timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: 'from #${ROLLED_BACK_RELEASE_NUMBER} · ${ROLLED_BACK_VERSION} · app_requested'
          timeout: 30000
          optional: true
# Every read after it is of a process that started on the embedded bundle.
- stopApp
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: ${EXPECTED_VERSION}
    timeout: 30000
- assertVisible: 'embedded'
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
# A device that was offline retries on its next sync.
- repeat:
    times: 3
    while:
      visible: 'failed · device_offline.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
# The rolled-back bundle is on this device's failed list: the check skips it.
- assertVisible: 'skipped · bundle_failed_before'
- assertVisible: 'embedded'
