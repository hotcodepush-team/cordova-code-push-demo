# The build trusts the app's public key, so the SDK applies only releases whose signature verifies.
# By hand, run `hotcodepush signing-key create`, rebuild, release, then run
# `maestro test -e EXPECTED_VERSION=v6 -e EXPECTED_RELEASE_NUMBER=5 -e EXPECTED_LINE='Public keys: 1' maestro/signed.yaml`.
appId: com.hotcodepush.demo.cordova
---
- runFlow: golden-path.yaml
- runFlow: debug-screen.yaml
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
