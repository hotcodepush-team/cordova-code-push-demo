# The running release is revoked.
# The next check moves the device to the newest older release it qualifies for.
# Continues from golden-path.yaml. By hand, revoke the running release, then run
# `maestro test -e EXPECTED_RELEASE_NUMBER=1 -e EXPECTED_VERSION=v2 maestro/revoke.yaml`.
appId: com.hotcodepush.demo.cordova
---
- launchApp:
    permissions:
      notifications: allow
# A page reload during a Maestro read can leave the Android view hierarchy empty for good.
# The flow therefore relaunches the app before it reads the screen.
- extendedWaitUntil:
    visible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
    timeout: 30000
    optional: true
- stopApp
- launchApp:
    permissions:
      notifications: allow
# The check at start may move the device on its own.
# Otherwise a tap does, retried for an offline device.
- repeat:
    times: 3
    while:
      notVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
    commands:
      # A web view that just loaded shows an empty view hierarchy for a moment.
      - extendedWaitUntil:
          visible: 'Sync now'
          timeout: 30000
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
      - extendedWaitUntil:
          visible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
          timeout: 30000
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
- stopApp
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: ${EXPECTED_VERSION}
    timeout: 30000
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
