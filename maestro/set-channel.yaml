# `setChannel('beta')` only stores the name.
# The next sync fails with channel_unknown, since no channel matches it.
# `setChannel(null)` restores the configured channel, and the next sync finds the device up to date.
# Continues from signed.yaml. By hand, on an app that runs the newest release, run
# `maestro test -e EXPECTED_RELEASE_NUMBER=7 -e EXPECTED_VERSION=v8 maestro/set-channel.yaml`.
appId: com.hotcodepush.demo.cordova
---
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
    timeout: 30000
- assertVisible: '.* · config'
# The method buttons sit below the fold on a phone screen.
- scrollUntilVisible:
    element: 'Set channel beta'
- tapOn: 'Set channel beta'
- extendedWaitUntil:
    visible: 'beta · runtime'
    timeout: 10000
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
# A device that was offline retries on its next sync.
- repeat:
    times: 3
    while:
      visible: 'failed · device_offline.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
- assertVisible: 'failed · channel_unknown.*'
- tapOn: 'Clear channel'
- extendedWaitUntil:
    visible: '.* · config'
    timeout: 10000
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- repeat:
    times: 3
    while:
      visible: 'failed · device_offline.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
- assertVisible: 'up_to_date'
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
