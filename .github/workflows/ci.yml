name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  web:
    name: Check and build the web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  android:
    name: Build the Android debug app
    runs-on: ubuntu-latest
    env:
      # The build step holds no token here: it builds without the API, and the app it builds names no channel.
      HOTCODEPUSH_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: npm ci
      - run: npm run build
      - run: npx cordova prepare android
      - run: npx cordova compile android --debug
  ios:
    name: Build the iOS simulator app
    runs-on: macos-latest
    env:
      # The build step holds no token here: it builds without the API, and the app it builds names no channel.
      HOTCODEPUSH_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cordova prepare ios
      - run: npx cordova compile ios --debug --emulator
