# A visitor installs one of these builds, and every later merge to main ships an update it takes.
# The SDK takes only releases created after its binary was built, so a local build would see none.
name: Downloads

on:
  push:
    tags: ['binary/*']

permissions:
  contents: write

env:
  JAVA_VERSION: 21
  # The build step resolves the channel with the token, so the downloads follow the demo's app.
  HOTCODEPUSH_TOKEN: ${{ secrets.HOTCODEPUSH_TOKEN }}

jobs:
  android:
    name: Build the Android release app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - run: npm run build
      - run: npx cordova prepare android
      # A release build yields an app bundle by default, which a device cannot install.
      - run: npx cordova compile android --release -- --packageType=apk
      - run: mv platforms/android/app/build/outputs/apk/release/app-release.apk hotcodepush-demo-cordova-android.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: hotcodepush-demo-cordova-android.apk
  ios:
    name: Build the iOS simulator release app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cordova prepare ios
      # An archive is the store build: its build step creates the binary, a plain build only writes the resource file.
      - run: xcodebuild archive -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO -quiet
        working-directory: platforms/ios
      - run: ditto -c -k --keepParent "platforms/ios/build/App.xcarchive/Products/Applications/HotCodePush Demo.app" hotcodepush-demo-cordova-ios-simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: hotcodepush-demo-cordova-ios-simulator.zip
  publish:
    name: Publish the downloads as a GitHub release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "Downloads $GITHUB_REF_NAME"
          --notes "The Android APK and the iOS simulator app of the Cordova demo, built from this tag and pre-configured for the demo's app on production."
          hotcodepush-demo-cordova-android.apk
          hotcodepush-demo-cordova-ios-simulator.zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
