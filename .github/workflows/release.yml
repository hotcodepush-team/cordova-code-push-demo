name: Release to production

on:
  push:
    branches: [main]

# A running release finishes first. Of the merges waiting behind it, only the newest runs, and it includes the others.
concurrency:
  group: release

permissions:
  contents: read

jobs:
  release:
    name: Build and release the web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The release runs the CLI that package.json pins, the one the native builds run, so one bump moves both.
      - id: cli
        run: echo "spec=$(jq -r .devDependencies.hotcodepush package.json)" >> "$GITHUB_OUTPUT"
      - uses: hotcodepush-team/release-action@6701b80821c77a041aa77d87fc88bda555c1a2cb # v0.2.0
        with:
          token: ${{ secrets.HOTCODEPUSH_TOKEN }}
          channel: production
          # Staging until launch.
          api-url: https://api.staging.hotcodepush.com
          cli-version: ${{ steps.cli.outputs.spec }}
