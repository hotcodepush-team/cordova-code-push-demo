# The binaries are built first and the release after them, so a download always takes the newest release.
# A visitor installs the download and sees `v1` turn into the label on main.
name: Release to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# A running release finishes first. Of the merges waiting behind it, only the newest runs, and it includes the others.
concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  android:
    name: Build the Android release app
    # A manual run releases main alone; a branch never ships to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HOTCODEPUSH_TOKEN: ${{ secrets.HOTCODEPUSH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      # The downloads carry v1 and main a later label, so the first sync of a download shows a new one.
      - run: sed -i "s/const VERSION = '[^']*'/const VERSION = 'v1'/" src/main.ts
      - run: npm run build
      - run: npx cordova prepare android
      # A release build yields an app bundle by default, which a device cannot install.
      # build.json signs with the debug keystore, which a fresh runner has not made yet.
      - run: mkdir -p ~/.android && keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      # Each run is its own store build, so the build number is the run number and a changed bundle never lands under an existing build.
      - run: npx cordova compile android --release -- --packageType=apk --versionCode="$GITHUB_RUN_NUMBER"
      - run: mv platforms/android/app/build/outputs/apk/release/app-release.apk hotcodepush-demo-cordova-android.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: hotcodepush-demo-cordova-android.apk
  ios:
    name: Build the iOS simulator release app
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      HOTCODEPUSH_TOKEN: ${{ secrets.HOTCODEPUSH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sed -i '' "s/const VERSION = '[^']*'/const VERSION = 'v1'/" src/main.ts
      - run: npm run build
      - run: npx cordova prepare ios
      # An archive is the store build: its build step creates the binary, a plain build only writes the resource file.
      - run: xcodebuild archive -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" -quiet
        working-directory: platforms/ios
      - run: ditto -c -k --keepParent "platforms/ios/build/App.xcarchive/Products/Release-iphonesimulator/HotCodePush Demo.app" hotcodepush-demo-cordova-ios-simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: hotcodepush-demo-cordova-ios-simulator.zip
  downloads:
    name: Publish the downloads as a GitHub release
    if: github.ref == 'refs/heads/main'
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      # One release per store build, the newest marked latest, so releases/latest is always the newest download.
      - run: >-
          gh release create "build/$GITHUB_RUN_NUMBER"
          --target "$GITHUB_SHA"
          --latest
          --title "Build $GITHUB_RUN_NUMBER"
          --notes "The Android APK and the iOS simulator app of the demo, built from $GITHUB_SHA and pre-configured for the demo's app on production."
          hotcodepush-demo-cordova-android.apk
          hotcodepush-demo-cordova-ios-simulator.zip
  release:
    name: Build and release the web bundle
    if: github.ref == 'refs/heads/main'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The release runs the CLI that package.json pins, the one the native builds run, so one bump moves both.
      - id: cli
        run: |
          spec=$(jq -re .devDependencies.hotcodepush package.json)
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
      - uses: hotcodepush-team/release-action@eefbfe59d6c6d648daf885867538fc62754f32a9 # v0.3.0
        with:
          token: ${{ secrets.HOTCODEPUSH_TOKEN }}
          bundle-version: ${{ github.sha }}
          cli-version: ${{ steps.cli.outputs.spec }}
