<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' gap:; img-src 'self' data:"
    />
    <!--
      No viewport-fit=cover: cordova-ios shows the web view only once the page has loaded and hands it the safe-area
      insets after that, so a page that pads itself by them jumps right when it appears. Cordova insets the web view
      instead and paints the strip behind the status bar in the theme colour, the page's background.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0a0a"
    />
    <title>HotCodePush Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script src="cordova.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Bundle version</p>
        <h1 id="version"></h1>
      </header>
      <dl>
        <div>
          <dt>Current release</dt>
          <dd id="current-release">…</dd>
        </div>
        <div>
          <dt>Device id</dt>
          <dd id="device-id">…</dd>
        </div>
        <div>
          <dt>Last sync</dt>
          <dd id="last-sync">…</dd>
        </div>
        <div>
          <dt>Last rollback</dt>
          <dd id="last-rollback">none</dd>
        </div>
      </dl>
      <div class="actions">
        <button id="sync-button" type="button">Sync now</button>
        <button id="debug-button" type="button" class="secondary">
          Debug screen
        </button>
      </div>
    </main>
  </body>
</html>
